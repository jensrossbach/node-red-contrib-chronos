<script type="text/html" data-help-name="chronos-config">
    <p>
        Gemeinsame Konfiguration aller Flow-Knoten.
    </p>
    <h3>Details</h3>
    <p>
        Diese Konfiguration speichert die gemeinsame Konfiguration aller Flow-Knoten
        wie beispielsweise die geografische Lage in Form von Breiten- und Längengrad,
        eine ggf. abweichende Zeitzone, das Verhalten beim Umstellen zwischen Winter-
        und Sommerzeit sowie benutzdefinierte Sonnenstände.
    </p>
    <p>
        Für weitere Informationen bitte die ausführliche Dokumentation im
        <a href="https://github.com/jensrossbach/node-red-contrib-chronos/wiki/Configuration-Node">Repository-Wiki</a>
        öffnen (nur in Englisch verfügbar).
    </p>
    <h3>Konfiguration</h3>
    <dt>Name</dt>
    <dd>
        Der Name der Konfiguration (optional).
    </dd>
    <dt>Breitengrad</dt>
    <dd>
        Der Breitengrad als Dezimalzahl zwischen -90° und 90° oder der Name
        einer Umgebungs- oder globalen Kontextvariablen, die den Breitengrad
        enthält.
    </dd>
    <dt>Längengrad</dt>
    <dd>
        Der Längengrad als Dezimalzahl zwischen -180° und 180° oder der Name
        einer Umgebungs- oder globalen Kontextvariablen, die den Längengrad
        enthält.
    </dd>
    <dt>Lokalisierung</dt>
    <dd>
        Durch Drücken dieses Knopfes wird die aktuelle Position automatisch
        ermittelt und die Felder für Breitengrad und Längengrad ausgefüllt.
        Der Knopf ist nur dann sichtbar, wenn der Browser diese Funktion
        unterstützt. Es erscheint eine Sicherabfrage, die bestätigt werden
        muss, um die Lokalisierung durchzuführen.
    </dd>
    <dt>Zeitzone</dt>
    <dd>
        <p>
            Der Name einer <a href="https://en.wikipedia.org/wiki/List_of_tz_database_time_zones">internationalen Zeitzone</a>
            oder der Name einer Umgebungs- oder globalen Kontextvariablen,
            die die Zeitzone enthält. Wenn nicht angegeben, wird die
            konfigurierte Zeitzone des Hosts verwendet, auf dem Node-RED
            ausgeführt wird.
        </p>
        <p>
            <b>Hinweis:</b> Es findet keine automatische Berechnung der Zeitzone
            aus den geografischen Koordinaten statt!
        </p>
    </dd>
    <dt>Verhalten zum Beginn der Sommerzeit</dt>
    <dd>
        Das Verhalten zum Beginn der Sommerzeit, d.h. die fehlende Stunde in der
        Nacht der Umstellung zu überspringen, zu verschieben oder einzufügen.
        Momentan hat diese Einstellung nur Auswirkungen auf den Cron-Tabellen
        Modus des Zeitplanerknotens und den erweiterten Modus des
        Wiederholungsknotens.
    </dd>
    <dt>Wiederholte Stunde am Ende der Sommerzeit überspringen</dt>
    <dd>
        Wenn aktiviert, wird die wiederholte Stunde in der Nacht der Umstellung
        auf Winterzeit übersprungen. Momentan hat diese Einstellung nur
        Auswirkungen auf den Cron-Tabellen Modus des Zeitplanerknotens und den
        erweiterten Modus des Wiederholungsknotens.
    </dd>
    <dt>Sonnenstände</dt>
    <dd>
        Liste der benutzerdefinierten Sonnenstände. Neue Einträge können über
        den Button unterhalb der Liste hinzugefügt werden. Vorhandene Einträge
        können neu angeordnet oder gelöscht werden.
        Jeder Eintrag in der Liste kann wie folgt konfiguriert werden:
        <ul>
            <li>
                Der Sonnenstandswinkel oberhalb (positive Werte) oder unterhalb
                (negative Werte) des Horizonts in Grad.
            </li>
            <li>
                Der Name des Sonnenstands für die aufgehende Sonne.
            </li>
            <li>
                Der Name des Sonnenstands für die untergehende Sonne.
            </li>
        </ul>
        Namen dürfen aus Buchstaben, Zahlen und Unterstrich bestehen und müssen
        eindeutig sein.
    </dd>
</script>
